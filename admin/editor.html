<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Post editor — Hassan</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../assets/admin/admin.css"></head><body class="admin-body"><header class="admin-top"><a class="wordmark" href="/">hassan<span>®</span></a><div><span id="save-state">All changes saved</span><a href="/admin">Dashboard</a><button id="logout">Sign out</button></div></header><main class="editor-shell"><div class="editor-heading"><a href="/admin">← Dashboard</a><div class="editor-actions"><button id="preview" class="admin-button">Preview</button><button id="save-draft" class="admin-button">Save draft</button><button id="publish" class="admin-button primary">Publish</button></div></div><div class="editor-layout"><section class="editor-main"><input id="title" class="title-input" maxlength="120" placeholder="Post title" aria-label="Post title"><div class="editor-toolbar" role="toolbar" aria-label="Formatting"><select id="block-type" aria-label="Text style"><option value="p">Paragraph</option><option value="h1">Heading 1</option><option value="h2">Heading 2</option><option value="h3">Heading 3</option><option value="h4">Heading 4</option></select><button data-cmd="bold"><b>B</b></button><button data-cmd="italic"><i>I</i></button><button data-cmd="underline"><u>U</u></button><button data-cmd="strikeThrough"><s>S</s></button><button data-cmd="insertUnorderedList">• List</button><button data-cmd="insertOrderedList">1. List</button><button data-cmd="formatBlock" data-value="blockquote">Quote</button><button id="add-link">Link</button><button id="add-video">YouTube</button><button id="add-image">Image</button><button id="add-table">Table</button><button id="add-divider">Divider</button><button data-cmd="undo">Undo</button><button data-cmd="redo">Redo</button><input id="image-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif" hidden></div><div id="content" class="content-editor" contenteditable="true" role="textbox" aria-label="Post content" aria-multiline="true" data-placeholder="Start writing your note…"></div><div class="editor-foot"><span id="word-count">0 words · 1 min read</span><span>Drafts save in this browser connected to Firestore</span></div><div id="slash-menu" class="slash-menu" hidden><button data-slash="heading">Heading</button><button data-slash="bullet">Bulleted list</button><button data-slash="quote">Quote</button><button data-slash="code">Code block</button><button data-slash="table">Table</button><button data-slash="divider">Divider</button></div><div id="upload-status" role="status"></div></section><aside class="editor-settings"><h2>Post settings</h2><label>URL slug<input id="slug" maxlength="80"></label><label>Short excerpt<textarea id="excerpt" rows="4" maxlength="300"></textarea></label><label>Tags, comma separated<input id="tags" placeholder="ai, automation"></label><div class="cover-fields"><label>Cover image<input id="cover-url" type="url" placeholder="Cloudinary URL"></label><label>Cover alt text<input id="cover-alt" maxlength="160"></label><label class="upload-label">Upload cover<input id="cover-file" type="file" accept="image/jpeg,image/png,image/webp,image/gif,image/avif"></label><progress id="upload-progress" max="100" value="0" hidden></progress></div><label>SEO title<input id="seo-title" maxlength="70"></label><label>SEO description<textarea id="seo-description" rows="3" maxlength="160"></textarea></label><label>Publish date<input id="publish-date" type="datetime-local"></label><p class="settings-note">Published notes appear on the public blog. Image uploads use Cloudinary.</p></aside></div></main><script type="module" src="../assets/admin/editor.js"></script></body></html>
